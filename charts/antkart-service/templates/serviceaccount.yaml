{{/*
=============================================================================
  ServiceAccount template

  Every pod in Kubernetes runs as a ServiceAccount. We need our own
  (instead of the "default" SA) for two reasons:

    1. Workload Identity annotation. The federation in the identity Terraform
       module trusts the OIDC subject
           system:serviceaccount:<namespace>:<name>
       That `name` MUST be the one we set here AND in the Terraform variable
       `products_k8s_service_account`. They drift = federation breaks silently
       with AADSTS70021.

    2. RBAC scoping. Even if we don't grant any K8s API roles to this SA
       (we don't, in Week 7), having a service-specific SA makes future
       RBAC grants surgical instead of cluster-wide.

  WHEN .Values.workloadIdentity.enabled = false:
    The annotation block is skipped. The SA is still created (Kubernetes
    needs one) but won't carry Workload Identity. Any DefaultAzureCredential
    call from pods using this SA will fail to authenticate to Azure — which
    is exactly the safe failure mode for the 7 services we haven't federated yet.
=============================================================================
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "antkart-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "antkart-service.labels" . | nindent 4 }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    # The federated managed identity's client ID. AKS's Workload Identity
    # mutating webhook reads this on pod admission and injects:
    #   - AZURE_CLIENT_ID env var
    #   - AZURE_TENANT_ID env var
    #   - AZURE_FEDERATED_TOKEN_FILE env var (path to the projected token)
    #   - the projected service-account token at that file path
    # The .NET DefaultAzureCredential's WorkloadIdentityCredential provider
    # then uses those to exchange for an Azure access token.
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
  {{- end }}
{{- end }}
